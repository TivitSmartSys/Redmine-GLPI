# Field mapping Redmine -> GLPI.
#
# GOVERNING RULE (spec section 4): custom fields are matched by NAME, never by
# ID. Custom-field IDs differ between Redmine trackers - the source document
# claimed "Situação Faturamento" was index 9, while ID 9 is actually
# "Ano de Início". Matching by ID would write a year into a billing-status field.
#
# Source kinds:
#   attribute    - dotted path into the issue JSON, e.g. status.id
#   custom_field - matched against custom_fields[].name (case/space-insensitive)
#   issue_id     - the Redmine issue id itself
# Several sources may be listed; the first one that yields a non-empty value wins.
#
# Transform kinds:
#   text     - verbatim + .strip(). NEVER parsed as a number.
#   date     - verbatim yyyy-mm-dd; the key is omitted entirely when empty.
#   datetime - Redmine's UTC timestamp -> a MySQL DATETIME on the GLPI server
#              clock (UTC-3, measured 2026-08-27). Used only by date_creation.
#   integer  - numeric passthrough (done_ratio)
#   yesno    - "Não"/"Sim" -> 0/1; unrecognised value -> skip field + warning
#   status   - via status_map.yml
#   user     - via user_map.yml
#   dropdown - name -> id lookup in the GLPI dictionary named by `itemtype`
#
# ---------------------------------------------------------------------------
# GLPI dictionary contents - verified live 2026-08-03
# ---------------------------------------------------------------------------
# ALL 13 dictionaries are now populated (on 2026-07-29 only 3 of 12 were, and
# the 9 empty ones were the common case). Entry counts:
#
#   Clientefielddropdown              (48)   <- filled since 2026-07-29
#   Tipodoprojetofielddropdown        (23)
#   Gestofielddropdown                 (2)   TIVIT, ITALTEL
#   Despesafielddropdown               (7)
#   Complexidadefielddropdown          (3)   BAIXA, ALTA, MÉDIA
#   Pendnciafielddropdown             (17)
#   Tipodependnciafielddropdown       (23)
#   Situaofaturamentofielddropdown     (3)
#   Enviodorelatriofielddropdown       (2)
#   Solicitaodoclientefielddropdown    (2)
#   Enviodobaremofielddropdown         (2)
#   Aprovaodoclientefielddropdown      (2)
#   Aprovaoparafinalizarfielddropdown  (2)
#
# A populated dictionary is not the same as full coverage: a Redmine value with
# no matching entry is still skipped and reported, never invented (spec 6.3).
# Run `python audit_coverage.py --tracker N` to see what would be lost.
#
# Two open questions from the spec are settled by this check:
#   - Appendix D asked whether "CAPEX GDS" exists in Despesa. It does.
#   - Section 6.3 asked about itemtype capitalisation. Both '...fielddropdown'
#     and '...fieldDropdown' resolve; GLPI matches itemtypes case-insensitively.
#
# Note that Complexidade is stored UPPERCASE in GLPI (BAIXA) while Redmine sends
# title case (Baixa) - the mandated case-insensitive comparison is what makes
# these match, so it must not be "optimised" into an exact comparison.

# ---------------------------------------------------------------------------
# Core project columns (glpi_projects) - spec section 5
# ---------------------------------------------------------------------------
project_core:
  - column: name
    transform: text
    sources: [{from: attribute, name: subject}]

  - column: content
    transform: text
    # Redmine Textile markup is copied verbatim; conversion is out of scope in v1.
    sources: [{from: attribute, name: description}]

  - column: projectstates_id
    transform: status
    sources: [{from: attribute, name: status.id}]

  - column: users_id
    transform: user
    sources: [{from: attribute, name: assigned_to.id}]

  - column: plan_start_date
    transform: date
    sources: [{from: attribute, name: start_date}]

  # Spec 11.2 - default order is the custom field first, due_date as fallback.
  # Swap the two entries here to invert the precedence; no code change needed.
  - column: plan_end_date
    transform: date
    sources:
      - {from: custom_field, name: "DATA TERMINO PLANEJADA"}
      - {from: attribute, name: due_date}

  # Spec 11.5 - deliberately NO closed_on fallback. Source data is inconsistent
  # (issue 17582 has closed_on while status is Encerramento and done_ratio 90),
  # so closed_on is reported only, never written.
  - column: real_end_date
    transform: date
    sources: [{from: custom_field, name: "Data Finalização"}]

  - column: percent_done
    transform: integer
    sources: [{from: attribute, name: done_ratio}]

  - column: comment
    transform: text
    sources: [{from: custom_field, name: "NOTAS"}]

  # Data de criação do issue no Redmine (attribute created_on, NOT a custom
  # field). glpi_projects.date_creation is invisible in the GLPI form, which is
  # why it needs no dictionary and no rights of its own - but GLPI does honour
  # it on POST rather than stamping the server clock over it (verified live
  # 2026-08-27 on throwaway project 1297, purged afterwards).
  - column: date_creation
    transform: datetime
    sources: [{from: attribute, name: created_on}]

# entities_id: TODO (spec 11.3, unresolved). The key is deliberately NOT sent -
# GLPI creates the project in the API session's active entity. Do not guess.

# ---------------------------------------------------------------------------
# Plugin container 15 "camposadicionaisprojetos" - spec sections 6.2 and 6.3
# ---------------------------------------------------------------------------
container15:
  # Deduplication marker. Written ALWAYS, even when every other field is empty
  # (spec 9.1). Note: the marker is `rdmfield`, NOT the inactive `idrdmfield`.
  - column: rdmfield
    transform: text
    sources: [{from: issue_id}]

  - column: dataderecebimentodatapfield
    transform: date
    sources: [{from: custom_field, name: "Data de recebimento da TAP"}]

  - column: nmerodopedidoclientefield
    transform: text
    sources: [{from: custom_field, name: "Número do pedido cliente"}]

  - column: datadesolicitaobaremofield
    transform: date
    sources: [{from: custom_field, name: "Data de solicitação Baremos"}]

  - column: datadeentregadapropostafield
    transform: date
    sources: [{from: custom_field, name: "Data de entrega da proposta"}]

  - column: datadeaprovaodapropostafield
    transform: date
    sources: [{from: custom_field, name: "Data de aprovação da proposta"}]

  # PRODUCTION, 2026-09-03. The old `andamentodoprojetofield` is a plugin `text`
  # column, i.e. VARCHAR(255), and 92 issues overflow it (worst 2788 chars). The
  # plugin cannot change a field's type after creation, so the admin created a
  # SECOND field, `andamentodoprojetofieldtwo` (id 173, type textarea, backed by
  # TEXT). `longtext` is `text` that is exempt from PLUGIN_TEXT_MAX_LENGTH - see
  # transform/mapper.py. Writing the old field as well was rejected: it would
  # store a truncated copy of the same value in a column nobody reads.
  - column: andamentodoprojetofieldtwo
    transform: longtext
    sources: [{from: custom_field, name: "Andamento do Projeto"}]

  # Brazilian number convention ("66.977,45"). GLPI column is text -> copy
  # verbatim, strip() only. Never float().
  - column: valordoprojetofield
    transform: text
    mandatory: true
    sources: [{from: custom_field, name: "Valor do Projeto"}]

  # PRODUCTION spelling, 2026-09-03: no `two` suffix on this instance.
  - column: responsvelclientefield
    transform: text
    mandatory: true
    sources: [{from: custom_field, name: "Responsável Cliente"}]

  - column: backlogfield
    transform: yesno
    sources: [{from: custom_field, name: "Backlog"}]

  # Cliente was a never_write ("preencher à mão no GLPI") while its dictionary
  # was empty. Verified live 2026-08-03: PluginFieldsClientefielddropdown holds
  # 48 entries and clientefield (id 96) is is_active 1, is_readonly 0,
  # mandatory 0 - so it is migrated like any other dropdown. Values with no
  # matching entry are still skipped and reported; we never create entries.
  #
  # CLOSED DECISION 2026-08-03 - do not "fix" this with an alias table.
  # Redmine records the same two utilities under both their old and their
  # current names, and only the current ones exist in GLPI:
  #     COELCE (481 issues) = ENEL CE (36),  AMPLA (456 issues) = ENEL RJ (38)
  # Deliberately left unmigrated: those 937 projects arrive with Cliente empty
  # and a line in section 4 of their report. Mapping old names onto the Enel
  # entries was considered and rejected - the migrator must not decide that two
  # client names are the same company.
  #
  # To be registered in GLPI by hand before production (70 fills), spelled as
  # Redmine has them - matching is case-insensitive after .strip():
  #     CGTF (48), NEOENERGIA (8), COSERN (8), ENEVA/MPX (5), ENPECEL (1)
  # REMOVED 2026-09-03 - see never_write.cliente below. Production has no
  # `clientefield` at all and no PluginFieldsClientefielddropdown table; the
  # manager's answer to the preparation list closed it: "não haverá campo
  # cliente, o antigo campo cliente do REDMINE será substituído pelas entidades
  # do GLPI". Cliente now reaches GLPI only as the project's entity, via
  # config/entity_map.yml.

  - column: plugin_fields_tipodoprojetofielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsTipodoprojetofielddropdown
    sources: [{from: custom_field, name: "Tipo do Projeto"}]

  - column: plugin_fields_gestofielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsGestofielddropdown
    mandatory: true
    sources: [{from: custom_field, name: "Gestão"}]

  - column: plugin_fields_despesafielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsDespesafielddropdown
    mandatory: true
    sources: [{from: custom_field, name: "Despesa"}]

  - column: plugin_fields_complexidadefielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsComplexidadefielddropdown
    mandatory: true
    sources: [{from: custom_field, name: "Complexidade"}]

  - column: plugin_fields_pendnciafielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsPendnciafielddropdown
    sources: [{from: custom_field, name: "Pendência"}]

  - column: plugin_fields_tipodependnciafielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsTipodependnciafielddropdown
    sources: [{from: custom_field, name: "Tipo de Pendência"}]

  - column: plugin_fields_situaofaturamentofielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsSituaofaturamentofielddropdown
    sources: [{from: custom_field, name: "Situação Faturamento"}]

  - column: plugin_fields_enviodorelatriofielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsEnviodorelatriofielddropdown
    sources: [{from: custom_field, name: "Envio do Relatório"}]

  - column: plugin_fields_solicitaodoclientefielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsSolicitaodoclientefielddropdown
    sources: [{from: custom_field, name: "Solicitação do Cliente"}]

  - column: plugin_fields_enviodobaremofielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsEnviodobaremofielddropdown
    sources: [{from: custom_field, name: "Envio do Baremos"}]

  - column: plugin_fields_aprovaodoclientefielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsAprovaodoclientefielddropdown
    sources: [{from: custom_field, name: "Aprovação do Cliente"}]

  - column: plugin_fields_aprovaoparafinalizarfielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsAprovaoparafinalizarfielddropdown
    sources: [{from: custom_field, name: "Aprovação para Finalizar"}]

# ---------------------------------------------------------------------------
# Plugin container 26 "faturamento" - spec section 6.5, REWRITTEN 2026-08-06
#
# Fed by Redmine issues of tracker 15. Until 2026-08-06 these were rows of
# container 25 on the ROOT project; GLPI was reconfigured and a Faturamento is
# now a ProjectTask of type Faturamento (projecttasktypes_id 3) carrying one
# container-26 row. Container 25 is abandoned - never written again.
#
# Container 26 is NOT a drop-in twin of 25: every shared column carries a
# "...fieldtwo" suffix, and 26 adds two columns 25 never had
# (statusfaturamentofield, responsvelclientenffield). Column names verified
# live 2026-08-06 against GET /PluginFieldsField.
#
# Note on the old section: it wrote `valortotaldanffieldtwo` while container 25
# actually spells that column `valortotaldanffield`. GLPI drops unknown columns
# silently, so "Valor Total da NF" was LOST on every container-25 row ever
# written (check row id 2 / RDM 20389 by hand). The name is correct here.
# ---------------------------------------------------------------------------
container26:
  # PRODUCTION, 2026-09-03: this is plugin container 18 "abadefaturamento" and
  # its columns carry NO `two` suffix - the suffix belongs to the test instance's
  # container 26. All 16 fields were re-read live; the two textarea columns
  # (descriofield, observaefield) use `longtext`. `nconformidadefield` exists
  # here and stays unmapped for the reason it always did: no confirmed source.
  #
  # The `mandatory: true` flags that used to sit on four entries here were
  # removed on 2026-08-07: a sweep of GET /PluginFieldsField found mandatory=0
  # on every field of container 26. See MANDATORY_CONTAINER26_COLUMNS in
  # config/settings.py, now empty.
  - column: ttulofield
    transform: text
    sources: [{from: attribute, name: subject}]

  # textarea on production (TEXT, not VARCHAR(255)) -> longtext, never cut.
  - column: descriofield
    transform: longtext
    sources: [{from: attribute, name: description}]

  - column: nnffield
    transform: text
    sources: [{from: custom_field, name: "No. NF"}]

  # US number convention (" 5593.40" - note the leading space). Copy verbatim,
  # strip() only. The paired project field uses the Brazilian convention;
  # normalising either one would desync project and invoice values.
  - column: valortotaldanffield
    transform: text
    sources: [{from: custom_field, name: "Valor Total da NF"}]

  # New in container 26. Populated in all 50 tracker-15 issues sampled on
  # 2026-08-06, which is why it moved out of report_only/no_counterpart.
  - column: responsvelclientenffield
    transform: text
    sources: [{from: custom_field, name: "Responsável Cliente NF"}]

  # Priority is dropped globally for projects and tasks; this one instance is
  # migrated because container 26 flagged it mandatory. The flag went away on
  # 2026-08-07, the mapping stays - the value resolves cleanly and dropping it
  # now would lose data for no reason. Source is the CORE priority attribute -
  # tracker 15 has no "Prioridade" custom field. Verified live 2026-08-06: the
  # dictionary holds Alta / Crítica / Urgente / Normal / Baixa, and all 50
  # sampled issues carry "Normal", so it resolves.
  - column: plugin_fields_prioridadefielddropdowns_id
    transform: dropdown
    itemtype: PluginFieldsPrioridadefielddropdown
    sources: [{from: attribute, name: priority.name}]

  - column: npedidoclientefield
    transform: text
    sources: [{from: custom_field, name: "No. Pedido Cliente"}]

  - column: conformidadefield
    transform: yesno
    sources: [{from: custom_field, name: "Conformidade"}]

  - column: competnciafield
    transform: text
    sources: [{from: custom_field, name: "Competência"}]

  - column: emissodanffield
    transform: date
    sources: [{from: custom_field, name: "Emissão da NF"}]

  - column: projeodefaturamentofield
    transform: date
    sources: [{from: custom_field, name: "Projeção de Faturamento"}]

  - column: vencimentofield
    transform: date
    sources: [{from: custom_field, name: "Vencimento"}]

  - column: parcelaprojnanffield
    transform: text
    sources: [{from: custom_field, name: "Parcela Proj na NF"}]

  # textarea on production -> longtext, never cut.
  - column: observaefield
    transform: longtext
    sources: [{from: custom_field, name: "Observações"}]

  # statusfaturamentofield is NOT mapped - see never_write below. Its source
  # would be the core Redmine status ("Situação" is just the PT-BR label for it;
  # there is no custom field by that name on tracker 15, all 13 checked on
  # 2026-08-06), and that same status is already written to the task's own
  # Estado column via task_core.projectstates_id + status_map.yml. Duplicating
  # it into a plugin dropdown would mean maintaining the same five values in two
  # dictionaries forever.
  #
  # nconformidadefieldtwo has a column but no confirmed source - "Conformidade1"
  # (cf 154) is the candidate and its meaning is still unconfirmed. TODO, spec 6.5.

# ---------------------------------------------------------------------------
# Core task columns (glpi_projecttasks) - spec section 9.3
# ---------------------------------------------------------------------------
task_core:
  - column: name
    transform: text
    sources: [{from: attribute, name: subject}]

  - column: content
    transform: text
    sources: [{from: attribute, name: description}]

  - column: projectstates_id
    transform: status
    sources: [{from: attribute, name: status.id}]

  - column: plan_start_date
    transform: date
    sources: [{from: attribute, name: start_date}]

  - column: plan_end_date
    transform: date
    sources: [{from: attribute, name: due_date}]

  # glpi_projecttasktypes, new 2026-08-06. The `tasktype` transform maps the
  # Redmine tracker id through TRACKER_TO_PROJECTTASKTYPE in config/settings.py:
  # 15 -> 3 Faturamento, 18 -> 4 Atividade, 41 -> 5 Compras. Trackers 14 and 42
  # have no entry and are reported as NO_COUNTERPART, so an untyped task reads
  # as intentional rather than as a lookup that failed.
  - column: projecttasktypes_id
    transform: tasktype
    sources: [{from: attribute, name: tracker.id}]

  # Data de criação do issue no Redmine (attribute created_on, NOT a custom
  # field). glpi_projecttasks.date_creation is invisible in the GLPI form, which is
  # why it needs no dictionary and no rights of its own - but GLPI does honour
  # it on POST rather than stamping the server clock over it (verified live
  # 2026-08-27 on throwaway task 14215, purged afterwards).
  - column: date_creation
    transform: datetime
    sources: [{from: attribute, name: created_on}]

# Task assignment is intentionally absent: glpi_projecttasks has no direct
# assigned_to equivalent (it goes through ProjectTaskTeam). Spec 9.4 marks this
# DO WERYFIKACJI -> v1 skips the assignment and warns.

# ---------------------------------------------------------------------------
# Columns that must NEVER be written
# ---------------------------------------------------------------------------
never_write:
  # is_active: 0 in GLPI. NOTE (verified in plugin source 1.24.3, 2026-08-06):
  # writing to an inactive column is NOT rejected - populateData() selects
  # container fields without any is_active filter, and a direct REST row write
  # bypasses validation entirely. The real cost is that the value becomes
  # invisible in the GLPI form.
  #
  # rdmfield (field 92) was is_active 0 for part of 2026-08-06 and is active
  # again as of the same day. Either way it is always written - it is the dedup
  # marker, and searchText[rdmfield] works regardless of the flag.
  - column: idrdmfield
    reason: inactive
  # responsvelprojetofield (field 94) needs TWO fixes before it can be mapped:
  # is_active 1 AND a populated PluginFieldsResponsvelprojetofielddropdown. The
  # dictionary held 0 entries on 2026-08-06, so activating the field alone would
  # still skip every value under rule 2. Closed decision: leave it here for now.
  - column: responsvelprojetofield
    reason: inactive
  # Status Faturamento carries the same information as the task's core "Estado"
  # (projectstates_id), which glpi_projectstates already covers: ids 12-17 were
  # added by hand on 2026-08-06 precisely for the Faturamento statuses. Writing
  # both would duplicate the same five values across two dictionaries.
  #
  # SETTLED 2026-08-07: field 225 is no longer flagged mandatory (nor is any
  # other field of container 26), so it left MANDATORY_CONTAINER26_COLUMNS and
  # report section 5 no longer lists it. It stays here in never_write for the
  # original reason, which the unflagging does not change: the task's core
  # Estado already carries the same status.
  - column: plugin_fields_statusfaturamentofielddropdowns_id
    reason: redundant
  # Deliberate product decisions
  # Cliente: NOT a column on production at all (no clientefield, no
  # PluginFieldsClientefielddropdown). It is deliberately absent from this list
  # too - never_write records live on plan.never_write, which all_records()
  # excludes, and Cliente must stay inside the section-7 arithmetic. With no
  # mapping entry consuming it, the Mapper's sweep over unconsumed source custom
  # fields reports it as NO_COUNTERPART on every project, which is the honest
  # outcome: the value reaches GLPI as the project's ENTITY (entity_map.yml) and
  # nowhere else. Closed 2026-09-03 on the manager's written answer.
  #
  # Priority is dropped globally for projects and tasks. The ONE exception is
  # container 26's plugin_fields_prioridadefielddropdowns_id, which GLPI flags
  # mandatory - see the container26 section.
  - column: prioridadefield
    reason: skipped

# ---------------------------------------------------------------------------
# Redmine fields with no GLPI counterpart - always listed in the report
# ---------------------------------------------------------------------------
report_only:
  project:
    - {name: "Ano de Início", reason: no_counterpart}
  faturamento:
    # Container 26 has no Cliente column either - re-verified live 2026-08-06,
    # its only "cliente" columns are the text npedidoclientefieldtwo and
    # responsvelclientenffield. The project-level Cliente IS migrated
    # (container 15); this one still has nowhere to go.
    - {name: "Cliente", reason: no_counterpart}
    # "Responsável Cliente NF" left this list on 2026-08-06: container 26 has a
    # real column for it (responsvelclientenffield), and it is mandatory there.
    # "Conformidade1" (cf 154) is deliberately unmapped: its meaning is
    # unconfirmed and it is empty in every issue examined. TODO - spec 6.5.
    - {name: "Conformidade1", reason: unverified}
