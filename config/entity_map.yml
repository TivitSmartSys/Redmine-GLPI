# ---------------------------------------------------------------------------
# Redmine `Cliente` -> GLPI entity (entities_id of the migrated Project).
#
# Source: "Mapeamento ClienteRedmine EntidadeGLPI -1.pdf", supplied by the
# manager and confirmed with the sheet's author on 2026-08-12. Two rows were
# read from the cell positions rather than from an adjacent label and are
# confirmed as they stand: "ENERGISA" -> GRUPO NEOENERGIA > BRASIL (the cell
# sits in that row) and "VALE" -> VALE > BRASIL (a cell merged down rows 53-59;
# the top row is taken). Design: docs/superpowers/specs/2026-08-12-entity-mapping-design.md
#
# HOW THIS IS USED
#   `completename` is the key, NOT `id_teste`. The id is resolved at preflight
#   from GET /Entity, because the spreadsheet's ids belong to the TEST instance
#   ("ID GLPI TESTE") and production will number the same tree differently. A
#   hard-coded 4 would then file ENEL SP into some unrelated entity silently.
#   `id_teste` is kept only as a cross-check: preflight WARNS when the resolved
#   id differs, which is the signal "this instance is not the one in the sheet".
#
#   Verified live 2026-08-12: all 37 completenames below resolve on the test
#   instance AND match their id_teste, 37/37. GET /Entity returns completename
#   as "A > B > C", the exact form used here.
#
#   A client with no entry here is NOT an error: the project is created in
#   DEFAULT_ENTITY_ID (75) and the report says why. Never invent an entity,
#   never create one - rule 2 of CLAUDE.md.
#
# SPELLING IS MEASURED, NOT TRANSCRIBED
#   Matching is exact after .strip() + casefold, so the dash matters. The PDF
#   uses an en dash; Redmine and GLPI both use a plain hyphen. Every name below
#   was swept from the live data (5594 tracker-14/42 issues, 2026-08-12) and
#   spelled the way Redmine spells it. The issue counts in the comments come
#   from that sweep and are there to make an accidental rename obvious.
#
#   All 5594 root issues carry a Cliente - none is empty. Of them, 1060 (19%)
#   use a value with no entity here and will land in entity 75:
#       COELCE 481, AMPLA 456, CGTF 48, NEOENERGIA 8, COSERN 8, ENEVA/MPX 5,
#       ENPECEL 1, plus the two hyphen variants already covered below.
#   COELCE and AMPLA are the former names of ENEL CE and ENEL RJ. They are
#   deliberately NOT mapped, for the same reason they are not aliased in
#   mapping.yml (closed decision 2026-08-03): the migrator must not decide that
#   two client names are the same company. Raising it with the business is a
#   separate call - if they say yes, add the names to entities 5 and 3 here.
#
#   The CEMIG block maps cleanly but no tracker-14/42 issue uses it: CEMIG lives
#   on trackers 39/40, which are out of scope entirely. It is kept because the
#   sheet defines it and because scope has moved before.
# ---------------------------------------------------------------------------

entities:
  # -- Grupo Enel ----------------------------------------------------------
  - completename: "TIVIT > GRUPO ENEL > BRASIL > ENEL RJ"
    id_teste: 3
    clients:
      - "ENEL RJ"                      # 1101 issues
      - "ENEL RJ - Cabeamento"         # 43 - plain hyphen, not the PDF's en dash

  - completename: "TIVIT > GRUPO ENEL > BRASIL > ENEL SP"
    id_teste: 4
    clients: ["ENEL SP"]               # 836

  - completename: "TIVIT > GRUPO ENEL > BRASIL > ENEL CE"
    id_teste: 5
    clients: ["ENEL CE"]               # 1066

  - completename: "TIVIT > GRUPO ENEL > BRASIL > EGP BR"
    id_teste: 6
    clients: ["CDSA", "EGP", "GPG", "VGR"]   # 25, 142, 269, 1

  - completename: "TIVIT > GRUPO ENEL > BRASIL > ENEL X"
    id_teste: 7
    clients: ["ENEL X"]                # 4

  # -- Grupo Energisa / Neoenergia -----------------------------------------
  - completename: "TIVIT > GRUPO ENERGISA > BRASIL > ENERGISA PARAIBA"
    id_teste: 27
    clients: ["ENERGISA PB"]           # unused by trackers 14/42

  - completename: "TIVIT > GRUPO NEOENERGIA > BRASIL"
    id_teste: 32
    clients: ["ENERGISA"]              # unused; row confirmed with the author

  - completename: "TIVIT > GRUPO NEOENERGIA > BRASIL > NEOENERGIA COELBA"
    id_teste: 33
    clients: ["COELBA"]                # unused

  - completename: "TIVIT > GRUPO NEOENERGIA > BRASIL > NEOENERGIA ELEKTRO"
    id_teste: 36
    clients: ["ELEKTRO"]               # unused

  # -- Vale ----------------------------------------------------------------
  - completename: "TIVIT > VALE > BRASIL"
    id_teste: 53
    clients: ["VALE"]                  # 1

  # -- Hydro ---------------------------------------------------------------
  - completename: "TIVIT > HYDRO > BRASIL > PARAGOMINAS"
    id_teste: 65
    clients: ["PARAGOMINAS"]           # 27

  - completename: "TIVIT > HYDRO > BRASIL > ALUNORTE"
    id_teste: 66
    clients: ["ALUNORTE"]              # 66

  - completename: "TIVIT > HYDRO > BRASIL > ALBRAS"
    id_teste: 67
    clients: ["ALBRAS"]                # 68

  # Created by the admin on production 2026-09-03 in answer to the preparation
  # list; it did not exist before. id is 83 there, 109 on test - the one entry
  # in this file whose id genuinely differs between the two instances.
  - completename: "TIVIT > HYDRO > BRASIL > HCO BELEM"
    id_teste: 83
    clients: ["HCO BELEM"]             # 7 roots

  # -- Grupo Equatorial ----------------------------------------------------
  - completename: "TIVIT > GRUPO EQUATORIAL > BRASIL > CELG"
    id_teste: 70
    clients:
      - "ENEL GO"                      # 423
      - "EQUATORIAL GO"                # 371
      - "EQUATORIAL GO - Automação"    # 10 - plain hyphen

  - completename: "TIVIT > GRUPO EQUATORIAL > BRASIL > RIO GRANDE SUL"
    id_teste: 71
    clients: ["EQUATORIAL SUL"]        # 19

  # -- Cemig ---------------------------------------------------------------
  # COLLAPSED 2026-09-03, on the manager's written answer to the preparation
  # list: "Observação: O que tiver de CEMIG vai para TIVIT > CEMIG > BRASIL >
  # DISTRIBUICAO". Production stops the CEMIG tree at that level - none of the
  # 21 leaf entities the spreadsheet named exists there, and the two the data
  # actually uses (CEMIG D, 4 roots; CEMIG GT, 2 roots) were explicitly routed
  # here rather than created. Verified live the same day: id 18,
  # "TIVIT > CEMIG > BRASIL > DISTRIBUICAO".
  #
  # The 19 other client names are kept on this one entry. They cost nothing,
  # they carry the same instruction, and dropping them would silently send a
  # future CEMIG value to DEFAULT_ENTITY_ID instead.
  - completename: "TIVIT > CEMIG > BRASIL > DISTRIBUICAO"
    id_teste: 18
    clients:
      - "CEMIG D"                      # 4 roots (tracker 39)
      - "CEMIG GT"                     # 2 roots (tracker 39)
      - "CEMIG G CAMARCOS"
      - "CEMIG G ITUTINGA"
      - "CEMIG G LESTE"
      - "CEMIG G OESTE"
      - "CEMIG G POÇO FUNDO"
      - "CEMIG G SUL"
      - "CEMIG PCH"
      - "CEMIG SIM"
      - "CEMIG TRADING"
      - "CEMIG_CENTRAL EÓLICA PARAJURU"
      - "CEMIG_CENTRAL EOLICA VOLTA DO RIO"
      - "CEMIG_COMPANHIA TRANSMISSÃO CENTROOESTE DE MINAS"
      - "CEMIG_EMPRESA DE SERVIÇOS DE COMERCIALIZAÇÃO DE ENERGIA ELÉTRICA"
      - "CEMIG_HORIZONTES ENERGIA"
      # underscore in the sheet, space in the GLPI dropdown - both kept.
      - "CEMIG_ROSAL ENERGIA"
      - "CEMIG ROSAL ENERGIA"
      - "CEMIG_SÁ CARVALHO"
      - "CEMIG_SETE LAGOAS TRANSMISSORA DE ENERGIA"
      - "CEMIG_UFV BOA ESPERANÇA"
      - "CEMIG_UFV TRÊS MARIAS"

# Clients the sheet marks "Nao sera migrado" - deliberately no entity. The
# project is still migrated, into DEFAULT_ENTITY_ID, and the report says the
# entity was withheld on purpose rather than missing by accident.
# "MS OPERAÇÕES" is spelled with a cedilla in the GLPI dropdown and without one
# in the sheet; neither appears on a tracker-14/42 issue, so both are listed.
nao_sera_migrado:
  - "CIEN"              # 39 issues
  - "ENDESA"            # 9
  - "ENDESA ESPANHA"    # unused
  - "MS OPERAÇÕES"      # unused
  - "MS OPERACÕES"      # unused - sheet spelling
  - "OUTRO"             # 65
