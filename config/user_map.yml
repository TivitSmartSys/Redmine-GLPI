# Redmine issue.assigned_to.id -> GLPI users_id
# Spec section 8.
#
# REBUILT 2026-09-03 AGAINST PRODUCTION, by measurement, not transcription.
# Every id below was resolved by reading GET /User on
# smartsystemsitsm and matching the Redmine login exactly (casefold + strip)
# against glpi_users.name. The previous file carried ids from the TEST
# instance, where the same people are numbered differently: paulo.rocha was 768
# there and is 717 here, rayssa.mota 769 -> 740, caroline.menezes 771 -> 305.
# Keeping the old numbers would have assigned four projects' worth of work to
# unrelated colleagues, silently - 768 and 769 are live accounts on production
# too, belonging to eduardo.barboza and erick.gabi.
#
# The Redmine side was swept the same day across all seven in-scope trackers
# (14, 42, 39, 18, 41, 15, 40 - 10 547 issues): 59 people appear as assignee.
# The `# n issues` comments are that sweep and exist so an accidental rename
# shows up as a change in the numbers.
#
# TWO ENTRIES ARE MATCHED BY PERSON, NOT BY LOGIN. Redmine's login has no
# counterpart on production, but the account exists under a different one and
# the full name settles it:
#     teodoro.lima  -> 72  teodoro.oliveira  "TEODORO OLIVEIRA LIMA"
#     henrique.sokal-> 278 henrique.hsokal   "HENRIQUE SOKAL"
# Nothing else was matched this way. The remaining 28 were checked against
# every account on the instance, by login and by first name + surname, and have
# none - they are recorded below with `glpi_id: null` so the report names them
# instead of leaving a silent gap.
#
# Policy (closed decision): a user with no GLPI counterpart - and an issue with
# no assigned_to at all - leave the field empty and add a warning to the report.
# Never abort the migration for this reason.
#
# To mark a Redmine user as deliberately unmapped, set glpi_id: null.

