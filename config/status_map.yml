# Redmine issue.status.id -> GLPI projectstates_id
# Spec section 7. Same map applies to Project and ProjectTask.
# A status outside this map: skip the field + warning, never abort the migration.
#
# Keys are Redmine status IDs; "label" is informational only (not written to GLPI).

statuses:
  15: {glpi_id: 1,  label: "Novo"}
  13: {glpi_id: 7,  label: "Em Elaboração"}
  9:  {glpi_id: 8,  label: "Aguardando Aprovação"}
  23: {glpi_id: 9,  label: "Planejamento"}
  17: {glpi_id: 5,  label: "Parado"}
  14: {glpi_id: 2,  label: "Em Execução"}
  24: {glpi_id: 6,  label: "Monitoramento e Controle"}
  25: {glpi_id: 10, label: "Encerramento"}
  16: {glpi_id: 3,  label: "Finalizado"}
  11: {glpi_id: 4,  label: "Cancelado"}
  18: {glpi_id: 11, label: "Não Aprovado"}

  # Faturamento statuses, added 2026-08-06 with tracker 15 becoming a real
  # ProjectTask. Without these three lines 3036 of the 3414 Faturamentos (88.9%)
  # would be created with no "Estado" at all - status 19 alone covers 2960.
  #
  # RE-MEASURED ON PRODUCTION 2026-09-03. glpi_projectstates holds exactly 15
  # rows there, no duplicates - unlike the test instance, which carried "Novo"
  # twice (1 and 12) and both spellings of "NF solicitada" (14 and 17). The
  # eleven states the admin created land on ids 4-15 and the three English
  # defaults were renamed in place, so ids 1/2/3 keep meaning Novo / Em Execução
  # / Finalizado and every non-NF line above needed no change. Only the three
  # Faturamento states moved: 15->14, 16->15, 17->13. Issue counts re-swept the
  # same day across all seven in-scope trackers.
  19: {glpi_id: 14, label: "NF Emitida"}      # 2987 issues
  21: {glpi_id: 15, label: "NF Paga"}         #   68 issues
  22: {glpi_id: 13, label: "NF Solicitada"}   #   13 issues

  # Production also has state 12 "Aguardando Formalização", which no Redmine
  # status in scope maps onto - all 14 statuses actually used are covered above.
  # Left unmapped deliberately; inventing a source for it would be a guess.
